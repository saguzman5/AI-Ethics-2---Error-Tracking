<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>Sign in · Production Quality</title>
  <link rel="icon" href="/shared/logo.svg">
  <link rel="stylesheet" href="/shared/theme.css">
  <style>
    body { min-height: 100vh; display: grid; place-items: center; background: linear-gradient(160deg, #0f172a, #1e3a8a); padding: 16px; }
    .login { width: 100%; max-width: 380px; padding: 28px; }
    .login .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
    .login .brand img { width: 44px; height: 44px; }
    .login h1 { font-size: 20px; }
    .login p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
    .login form { display: flex; flex-direction: column; gap: 14px; }
    .login .input { min-height: 50px; font-size: 17px; }
    .login .btn { min-height: 52px; font-size: 17px; }
    .err { color: var(--danger); font-size: 14px; min-height: 20px; }
  </style>
</head>
<body>
  <main class="card login">
    <div class="brand">
      <img src="/shared/logo.svg" alt="">
      <div><h1>Production Quality</h1><p>Error reporting &amp; tracking</p></div>
    </div>
    <form id="form" novalidate>
      <label class="field">Username
        <input class="input" id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      </label>
      <label class="field">Password
        <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
      </label>
      <div class="err" id="err" role="alert"></div>
      <button class="btn primary" id="submit" type="submit">Sign in</button>
    </form>
  </main>
  <script src="/shared/common.js"></script>
  <script src="/shared/login.js"></script>
</body>
</html>
