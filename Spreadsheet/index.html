<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spreadsheet · Production Quality</title>
  <link rel="icon" href="/shared/logo.svg">
  <link rel="stylesheet" href="/shared/theme.css">
  <link rel="stylesheet" href="/shared/manager.css">
  <link rel="stylesheet" href="/spreadsheet/spreadsheet.css">
</head>
<body>
  <header class="topbar"></header>
  <div class="page wide">
    <div class="page-head">
      <div>
        <h1>Error Reports Spreadsheet</h1>
        <div class="sub" id="status">Loading…</div>
      </div>
      <div class="actions">
        <a class="btn" id="exp-csv" href="#">Download CSV</a>
        <a class="btn primary" id="exp-xlsx" href="#">Download Excel (.xlsx)</a>
        <a class="btn" href="/dashboard/admin.html#sheet">Connect Google Sheets / Excel</a>
      </div>
    </div>
    <section class="card" id="filters"></section>
    <section class="card sheet-card">
      <div class="sheet-tools">
        <span id="count" class="muted"></span>
        <span class="spacer"></span>
        <button class="btn sm" id="clear-col">Clear column filters</button>
      </div>
      <div class="table-wrap sheet" id="grid"></div>
    </section>
  </div>
  <script src="/shared/common.js"></script>
  <script src="/shared/filters.js"></script>
  <script src="/shared/report-panel.js"></script>
  <script src="/spreadsheet/spreadsheet.js"></script>
</body>
</html>
